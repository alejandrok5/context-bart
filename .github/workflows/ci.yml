name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      # The smoke and manifest-verify steps use unix shell pipelines.
      # Force bash so Windows runs them under Git Bash instead of pwsh.
      - name: Smoke test (empty stdin)
        shell: bash
        run: echo '{}' | node bin/context-bart.js

      - name: Verify publish manifest (no test/ or .github/ leak)
        shell: bash
        run: |
          output=$(npm pack --dry-run --json)
          echo "$output"
          if echo "$output" | grep -E '"path":\s*"(test|\.github|eslint\.config|packages|test/|\.github/|packages/)' ; then
            echo "::error::Publish manifest contains files that should not ship." >&2
            exit 1
          fi

  pi-package:
    # packages/pi is a pi extension written in TypeScript; Node 22+ only
    # (it runs through pi's jiti loader, tests use --experimental-strip-types).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: packages/pi
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.x

      - name: Run tests
        run: npm test

      - name: Verify publish manifest (no test/ or docs/ leak)
        shell: bash
        run: |
          output=$(npm pack --dry-run --json)
          echo "$output"
          if echo "$output" | grep -E '"path":\s*"(test|docs|test/|docs/)' ; then
            echo "::error::Publish manifest contains files that should not ship." >&2
            exit 1
          fi
